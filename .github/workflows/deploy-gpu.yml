name: Test and deploy Transnet

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: transnet-production
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate documentation contracts
        run: python3 tools/validate_docs.py
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Lint all targets
        run: cargo clippy --all-targets --all-features --locked -- -D warnings
      - name: Run tests
        run: cargo test --all-targets --locked
      - name: Build documentation
        run: cargo doc --no-deps --locked
      - name: Build production binary
        if: github.event_name != 'pull_request'
        run: cargo build --release --locked
      - name: Package production release
        if: github.event_name != 'pull_request'
        run: |
          install -d release
          install -m 0755 target/release/transnet release/transnet
          install -m 0644 deploy/transnet.production.toml release/transnet.toml
      - name: Upload production release
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: transnet-${{ github.sha }}
          path: release
          if-no-files-found: error
          retention-days: 7

  deploy:
    if: github.event_name != 'pull_request'
    needs: test
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Download production release
        uses: actions/download-artifact@v4
        with:
          name: transnet-${{ github.sha }}
          path: release

      - name: Configure the deployment SSH key
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts
          ssh-keygen -F '[139.224.103.112]:16004' -f ~/.ssh/known_hosts >/dev/null

      - name: Stage immutable release on the GPU server
        env:
          RELEASE_ID: ${{ github.sha }}
        run: |
          ssh -i ~/.ssh/id_ed25519 -p 16004 \
            -o BatchMode=yes \
            -o StrictHostKeyChecking=yes \
            ashex@139.224.103.112 \
            "install -d -m 0755 /home/ashex/services/island.transnet/releases/$RELEASE_ID"
          scp -i ~/.ssh/id_ed25519 -P 16004 \
            -o BatchMode=yes \
            -o StrictHostKeyChecking=yes \
            release/transnet release/transnet.toml \
            "ashex@139.224.103.112:/home/ashex/services/island.transnet/releases/$RELEASE_ID/"
          ssh -i ~/.ssh/id_ed25519 -p 16004 \
            -o BatchMode=yes \
            -o StrictHostKeyChecking=yes \
            ashex@139.224.103.112 \
            "chmod 0755 /home/ashex/services/island.transnet/releases/$RELEASE_ID/transnet"

      - name: Activate, restart, and verify Island Transnet
        env:
          RELEASE_ID: ${{ github.sha }}
        run: |
          ssh -i ~/.ssh/id_ed25519 -p 16004 \
            -o BatchMode=yes \
            -o StrictHostKeyChecking=yes \
            ashex@139.224.103.112 "RELEASE_ID='$RELEASE_ID' bash -se" <<'REMOTE'
              set -euo pipefail
              root=/home/ashex/services/island.transnet
              release="$root/releases/$RELEASE_ID"
              test -x "$release/transnet"
              test -r "$release/transnet.toml"
              sed -i \
                -e 's#/run/transnet/transnet.sock#/home/ashex/services/island.transnet/transnet.sock#' \
                -e 's#/run/island-port/island-port.sock#/home/ashex/services/island-port/island-port.sock#' \
                "$release/transnet.toml"
              grep -Fq 'socket_path = "/home/ashex/services/island.transnet/transnet.sock"' \
                "$release/transnet.toml"
              grep -Fq 'socket_path = "/home/ashex/services/island-port/island-port.sock"' \
                "$release/transnet.toml"
              previous="$(readlink -f "$root/current" 2>/dev/null || true)"
              ln -sfn "$release" "$root/current.next"
              mv -Tf "$root/current.next" "$root/current"
              systemctl --user restart island-transnet.service
              healthy=false
              for _ in $(seq 1 30); do
                if systemctl --user is-active --quiet island-transnet.service \
                  && curl --fail --silent --show-error \
                    --unix-socket "$root/transnet.sock" \
                    --request POST http://localhost/api/v1/health \
                    --header 'content-type: application/json' \
                    --data '{}' >/dev/null; then
                  healthy=true
                  break
                fi
                sleep 1
              done
              if [ "$healthy" = true ]; then
                find "$root/releases" -mindepth 1 -maxdepth 1 -type d \
                  ! -path "$release" ! -path "$previous" -mtime +7 -exec rm -rf -- {} +
                exit 0
              fi
              if [ -n "$previous" ] && [ -d "$previous" ]; then
                ln -sfn "$previous" "$root/current.next"
                mv -Tf "$root/current.next" "$root/current"
                systemctl --user restart island-transnet.service || true
              fi
              exit 1
          REMOTE
